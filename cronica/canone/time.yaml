      entra_no_lugar_de: lukyy

# ---------------------------------------------------------------------------
# PERSONAGENS
#
# Cinco campos, e cada um faz um trabalho diferente no texto:
#
#   arquetipo      o rótulo. Uma frase. É como o leitor vai lembrar dele.
#   personalidade  como a pessoa É. A LLM usa isso pra dar VOZ, não pra elogiar.
#   se_acha        *** O CAMPO MAIS IMPORTANTE. ***
#                  A auto-imagem. O código cruza com o desempenho medido e
#                  classifica: confirmado / contradito / virou_verdade.
#                  'Contradito' é ouro: é conflito. 'Virou verdade' é o clímax
#                  de um arco — é literalmente evolução, medida.
#                  Escreva na primeira pessoa dele, com as palavras dele.
#   medo           o que ele evita. Explica as decisões ruins sem julgar.
#   bordoes        o que ele fala. Uma frase real vale três de descrição.
#   relacoes       a química. Duo, rivalidade, quem acalma quem.
#
# O exemplo abaixo está preenchido com um personagem FICTÍCIO só pra mostrar a
# profundidade que funciona. Apague ele.
# ---------------------------------------------------------------------------
personagens:

  # ---- EXEMPLO (fictício — apague) -------------------------------------
  # NÃO deixe este bloco: o id 'exemplo' não está no elenco e o validador vai
  # recusar o arquivo. Está aqui comentado só como referência de profundidade.
  #
  # exemplo:
  #   arquetipo: "o que nunca recua"
  #   personalidade: >
  #     Joga como se recuar fosse admitir derrota. Aprende rápido no mecânico e
  #     devagar no resto. Não fala muito na call, mas quando fala é pra
  #     reclamar do jungler — sempre.
  #   se_acha: "eu seguro qualquer 1v1 do meu elo, meu problema é o time"
  #   medo: "parecer o pior jogador da partida — então dobra a aposta quando
  #     está atrás, que é exatamente quando devia parar"
  #   bordoes:
  #     - "vem 1v1 então"
  #     - "eu tava ganhando a rota"
  #   relacoes:
  #     outro_id: "irmão mais novo da call; obedece o outro_id e ignora todos"
  # ----------------------------------------------------------------------

