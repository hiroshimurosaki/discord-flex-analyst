# ============================================================================
# CÂNONE — a camada que a Riot API nunca vai ter.
#
# Copie para `canone/time.yaml` e preencha. Este arquivo é a alma do projeto:
# os números saem da API, mas quem são vocês sai daqui.
#
# Valide a qualquer momento com:
#     python -m scripts.validar_canone canone/time.yaml
#
# Campos estruturais (riot_id, role) já vêm preenchidos com os 8 jogadores e as
# grafias exatas. Os campos de personagem estão como TODO de propósito — eu não
# vou inventar personalidade de gente real. As perguntas em cada TODO são para
# você responder no lugar delas.
# ============================================================================

time:
  nome: "TODO: como vocês se chamam? (mesmo que seja só 'a call')"
  desde: "TODO: YYYY-MM da primeira flex juntos, se você lembra"

# Instrução de tom que vai no prompt de TODO capítulo. É o que separa
# 'relatório de esports' de 'história dos seus amigos'. Escreva como você
# contaria pra alguém de fora, na mesa do bar.
voz: |
  TODO. Alguns eixos para você decidir:
    - zoeira pesada ou respeito sério? (ou zoeira que vira respeito no fim?)
    - narrador de fora, ou alguém de dentro do grupo contando?
    - pode xingar? pode citar apelido? tem assunto proibido?

# ---------------------------------------------------------------------------
# ELENCO
#
# ATENÇÃO — este corte titular/substituto é um PALPITE MEU, feito por número de
# partidas (do briefing do repo antigo), NÃO por quem vocês de fato chamam.
#
# As roles fecham: JUNGLE/BOTTOM/UTILITY/TOP/MIDDLE, uma de cada. O que não dá
# pra saber do número é a intenção — se o quinteto canônico é este, ou se o
# Nyachi joga mais bot que o Qiak e eu inverti, ou se o Yuya é top e não mid.
# Trocar alguém aqui é editar duas linhas; deixar errado envenena a história
# inteira, porque 'entrou o substituto' vira uma cena que nunca aconteceu.
#
# Se você não lembra quem é o quinteto canônico, colete os dados primeiro e
# rode `python -m scripts.quinteto` : ele conta quais 5 jogaram juntos mais
# vezes em flex e responde isso com dado em vez de memória.
# ---------------------------------------------------------------------------
elenco:
  titulares:
    hiroshi:
      nome: "Hiroshi"
      riot_id: "Hiroshi#10102"
      role: JUNGLE          # briefing diz Jungle/Mid (flex)
    qiak:
      nome: "Qiak"
      riot_id: "Qiak#000"
      role: BOTTOM
    thokyru:
      nome: "Thokyru"
      riot_id: "Thokyru#BR1"
      role: UTILITY
    lukyy:
      nome: "Lukyy"
      riot_id: "Lukyy#Luky"    # dois 'y' no nome, um no tag
      role: TOP
    yuya:
      nome: "Yuya Freecss"
      riot_id: "Yuya Freecss#BR1"   # dois 's' no fim
      role: MIDDLE          # briefing diz flex Top/Mid

  substitutos:
    nyachi:
