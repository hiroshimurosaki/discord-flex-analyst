# ============================================================================
# CÂNONE — a camada que a Riot API nunca vai ter.
#
# Copie para `canone/time.yaml` e preencha. Este arquivo é a alma do projeto:
# os números saem da API, mas quem são vocês sai daqui.
#
# Valide a qualquer momento com:
#     python -m scripts.validar_canone canone/time.yaml
#
# Campos estruturais (riot_id, role) já vêm preenchidos com os 8 jogadores e as
# grafias exatas. Os campos de personagem estão como TODO de propósito — eu não
# vou inventar personalidade de gente real. As perguntas em cada TODO são para
# você responder no lugar delas.
# ============================================================================

