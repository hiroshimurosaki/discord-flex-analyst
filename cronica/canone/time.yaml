# ---------------------------------------------------------------------------
# EVENTOS — os marcos fora do jogo.
#
# Isto é o que transforma um buraco no gráfico em capítulo. O código ancora cada
# evento na era em que a data caiu e entrega junto dos números daquele período.
#
# tipos: hiato | mudanca_vida | conquista | atrito | piada_interna | marco
#
# Não precisa ser preciso ao dia. Se você só sabe "foi por volta de março",
# põe 2025-03-15 e escreve a imprecisão no texto — o briefing repassa isso e a
# narração é instruída a não cravar o que não sabe.
# ---------------------------------------------------------------------------
eventos:
  - data: 2025-01-01
    tipo: marco
    titulo: "TODO: apague este e escreva os de verdade"
    texto: >
      Coisas que valem virar evento: quando alguém entrou ou saiu do grupo, a
      vez que vocês pararam de jogar e por quê, o dia em que alguém trocou de
      PC ou de internet, a briga que mudou o clima, a subida de elo que vocês
      comemoraram, a piada interna que nasceu de uma partida específica, o
      campeonato interno, o dia em que alguém mudou de role de vez.
    envolvidos: []

# ---------------------------------------------------------------------------
# MARCOS — os turning points DECLARADOS.
#
# `eventos` registra que algo aconteceu. `marcos` afirma que algo MUDOU o time,
# e cobra a conta: cada apontamento vira um veredito medido antes/depois.
#
# Diferença que importa: a detecção de eras acha QUANDO o time mudou, nunca POR
# QUÊ. Um dossiê apresentado numa call é uma causa datada. `divide_era: true`
# força a cronologia a cortar ali — sem isso, a mudança que ele provocou sai
# diluída dentro de uma era que começou por outro motivo.
#
# Em `apontamentos`, o `texto` é a FALA (vai pra narração com as suas palavras).
# `metrica` + `direcao` traduzem a fala para algo mensurável, no mesmo
# vocabulário fechado do `afirma`:
#
#   dano  carrega  rota  visao  farm  kda  morre_pouco  kp
#
# `direcao: alto` = a qualidade deve subir. Em `morre_pouco` a qualidade é
# morrer pouco, então 'alto' espera MENOS mortes.
#
# Apontamento SEM métrica continua valendo — entra na história, só não recebe
# veredito. É melhor assim: o código não adivinha o que "joga mais junto"
# significa em número, e não vai fingir que adivinhou.
#
# Os cinco vereditos possíveis:
#   atendeu   mudou no sentido pedido, e o acaso não explica  -> pagamento
#   indicio   mudou no sentido pedido, amostra ainda curta    -> esperança
#   inerte    não mudou além do ruído                         -> não pegou
#   piorou    mudou no sentido contrário                      -> conflito
#   sem_dado  não jogou o bastante de um dos lados            -> silêncio honesto
# ---------------------------------------------------------------------------
marcos:
  - id: dossie
    data: 2026-05-29
    titulo: "O dossiê"
    texto: >
      Apresentei dois decks para o grupo: "O Esquadrão" (fichas individuais,
      matriz de sinergia, time titular, premiação) e a "Análise Avançada"
      (roles, consistência, pontos fracos, tier list). Apontei, um por um, o
      que cada um precisava consertar — e distribuí os apelidos.
    divide_era: true

    # ATENÇÃO — a tradução de cada crítica para algo mensurável é MINHA leitura
    # dos slides, não sua fala. Confira uma por uma: um mapeamento errado aqui
    # produz um veredito errado sobre uma pessoa real. Se alguma cobrança não
    # couber em role/pool/volume/métrica, marque `tipo: livre` — ela continua
    # entrando na história, só não recebe número.
    apontamentos:

      hiroshi:
        texto: "ADC: 28.4% de WR em 37 jogos — evitar essa role. Focar Jungle/Mid, onde é 60%+."
        tipo: role_evitada
        role: BOTTOM

      qiak:
        texto: "Support: 44.4% — não é sua role ideal apesar do volume. Fixar ADC + Jungle."
        tipo: role_evitada
        role: UTILITY

      yuya:
        texto: "Volume baixo (61 jogos) — amostra pequena demais para conclusão definitiva. Jogar mais."
        tipo: volume

      thokyru:
        texto: "Mid: só 50% em 8 jogos, sem especialização. Explorar mais ADC (81.8%) ou manter Top+Sup como identidade."
        tipo: role_evitada
        role: MIDDLE

      nashorn:
        texto: "Jungle 48.1% — main role abaixo de 50%. Testar Mid como main (62.5%)."
        tipo: role_alvo
        role: MIDDLE

      topmogger:
        texto: "Apenas 25 jogos — dados insuficientes para análise confiável. Jogar mais para validar."
        tipo: volume

      lukyy:
        - texto: "Support: 25% de WR — não jogar mais essa role. Cortar Support e ADC completamente."
          tipo: role_evitada
          role: UTILITY
        - texto: "One-trick Gnar até o Gold. O Gnar 71.4% é real; o problema é jogar fora do pool."
          tipo: pool
          campeoes: ["Gnar"]

      nyachi:
        texto: "Dados insuficientes (7 jogos). Jogar pelo menos 50 partidas antes de qualquer análise."
        tipo: volume

# ---------------------------------------------------------------------------
# ANOTAÇÕES POR PARTIDA — o que você lembra de UM jogo específico.
#
# O resto do cânone é sobre pessoas e sobre períodos. Memória de grupo não é
# assim: ela é feita de partidas. "O dia em que o fulano jogou com febre" não é
# evento de calendário nem traço de personalidade — é uma linha do banco com
# uma história colada. Aqui você cola.
#
# O match_id você pega em `saida/roteiro.json`, nos briefings, ou direto no
# banco:
#     sqlite3 dados/fatos.db "select match_id, date(inicio_ts/1000,'unixepoch') \
#       from partidas where em_grupo=1 order by inicio_ts desc limit 20"
#
# Duas formas:
#     BR1_1234567890: "texto curto da nota"
#   ou
#     BR1_1234567890:
#       titulo: "A partida da febre"      # vira o título da cena
#       nota: "o que aconteceu"
#       destacar: true                    # ver abaixo
#
# `destacar: true` FORÇA a partida a virar cena do capítulo, mesmo que nenhum
# seletor a tenha escolhido. É a válvula de escape do sistema: o código escala
# cenas por função narrativa, mas a história é sua. Uma nota SEM `destacar`
# ainda vale — ela aparece sempre que aquela partida for escalada por outro
# motivo.
# ---------------------------------------------------------------------------
partidas: {}
